<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Job Matching Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1 class="title"><i>CV Job Matching Tool</i></h1>
        <table class="t">
            <tr>
                <td>
                    <form id="comparison-form" onsubmit="handleSubmit(event)">
                        <div class="form-content">
                            <div class="file-inputs">
                                <div class="file-input-group">  
                                    <label for="file1">Upload CV:</label>
                                    <input type="file" id="file1" name="file1" accept=".pdf" required>
                                </div>
                                <div class="file-input-group">
                                    <label for="file2">Upload Job Description:</label>
                                    <input type="file" id="file2" name="file2" accept=".pdf" required>
                                </div>
                            </div>
                            
                            <div class="button-container">
                                <button type="submit">Compare Files</button>
                            </div>                            
                            <div id="result" class="result"></div>
                        </div>
                    </form>
                </td>
                <td>
                    <div class="chart-container">
                        <canvas id="postingTypeChart"></canvas>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div class="chart-container">
                        <canvas id="agencyChart"></canvas>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script>
        // Initialize chart when page loads
        let agencyChart;
        let postingType;
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Agency Bar Chart
            const agencyCtx = document.getElementById('agencyChart').getContext('2d');
            agencyChart = new Chart(agencyCtx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Job Count',
                        data: [],
                        backgroundColor: 'rgba(67, 97, 238, 0.7)',
                        borderColor: 'rgba(67, 97, 238, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'Top Job Agencies'
                        }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Initialize Posting Type Pie Chart
            const postingTypeCtx = document.getElementById('postingTypeChart').getContext('2d');
            postingTypeChart = new Chart(postingTypeCtx, {
                type: 'pie',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: ['#4361ee', '#f72585', '#f72585', '#7209b7'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Posting Type Distribution'
                        }
                    }
                }
            });

            // Load data for both charts
            fetch('/job-title-data')
                .then(response => response.json())
                .then(data => {
                    // Update Agency Chart
                    agencyChart.data.labels = data.labels;
                    agencyChart.data.datasets[0].data = data.counts;
                    agencyChart.update();

                    // Update Posting Type Chart
                    postingTypeChart.data.labels = data.posting_type_labels;
                    postingTypeChart.data.datasets[0].data = data.posting_type_counts;
                    postingTypeChart.update();
                });
        });

        function handleSubmit(event) {
            event.preventDefault();
            const formData = new FormData();
            formData.append('file1', document.getElementById('file1').files[0]);
            formData.append('file2', document.getElementById('file2').files[0]);
            
            fetch('/compare', {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                const result = document.getElementById('result');
                if (data.error) {
                    result.innerHTML = '<div class="error"></div>';
                    result.firstChild.textContent = data.error;
                } else {
                    result.innerHTML =
                        `<div class="success">Similarity Score: ${data.score}%</div>`;
                }
            })
            .catch(() => {
                document.getElementById('result').innerHTML =
                    '<div class="error">Could not reach the server. Please try again.</div>';
            });
        }
    </script>
</body>
</html>
